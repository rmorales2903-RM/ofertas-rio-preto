name: diagnose-compremix
on:
  push:
    paths:
      - 'scripts/diagnose-compremix.mjs'
      - '.github/workflows/diagnose-compremix.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/diagnose-compremix.mjs
