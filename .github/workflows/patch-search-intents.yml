name: patch-search-intents
on:
  push:
    paths:
      - 'scripts/patch-search-intents.mjs'
      - '.github/workflows/patch-search-intents.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-search-intents.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/telegram.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add semantic product intent filters"
          git push
